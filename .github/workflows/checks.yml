name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  html:
    name: Validar HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: html-validate
        run: npx --yes html-validate "**/*.html"
